<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#1c1c1a;color:#e8e8e5;
  width:280px;padding:16px;
}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:32px;height:32px;border-radius:7px;background:#6366f1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:white;flex-shrink:0}
.title{font-size:14px;font-weight:600}
.subtitle{font-size:11px;color:#a0a09d;margin-top:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px 14px;border-radius:7px;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;margin-bottom:8px}
.btn-primary{background:#6366f1;color:white}
.btn-primary:hover{background:#5558e8}
.btn-primary:disabled{background:#3a3a60;color:#666;cursor:not-allowed}
.btn-secondary{background:#252523;color:#a0a09d;border:0.5px solid #3a3a38}
.btn-secondary:hover{background:#2e2e2c;color:#e8e8e5}
.status{font-size:11px;color:#a0a09d;text-align:center;min-height:16px;margin-top:2px}
.status.warn{color:#f5c842}
.status.error{color:#f87171}
.status.scanning{color:#7ba7f5}
.divider{border:none;border-top:0.5px solid #3a3a38;margin:10px 0}
</style>
</head>
<body>
<div class="logo-row">
  <div class="logo">T</div>
  <div>
    <div class="title">Thinkific Field Modifier</div>
    <div class="subtitle">Custom field code generator</div>
  </div>
</div>

<button class="btn btn-primary" id="scanBtn">
  ⟳ Scan page &amp; open editor
</button>
<button class="btn btn-secondary" id="blankBtn">
  ✎ Open editor (blank)
</button>

<div class="status" id="status"></div>

<script src="popup.js"></script>
</body>
</html>
